spring.application.name=chunks

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

vne.s3Config.access.key.id=${ACCESS_KEYID}
vne.s3Config.secret.key.access=${SECRETKEY_ACCESS}
vne.s3Config.bucket.name=${AWS_BUCKET}
vne.s3Config.base.url=${AWS_BASE_URL}
vne.s3Config.CLOUDFRONT.url=${AWS_CLOUDFRONT_URL}

spring.datasource.url=jdbc:postgresql://localhost:5433/uploads
spring.datasource.username=postgres
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=none

spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-name=vector_index
spring.ai.vectorstore.pgvector.initialize-schema=false
#spring.ai.vectorstore.pgvector.index-type=IVFFLAT
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=3072

spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3-flash-preview
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.project-id=${GENAI_PROJECT_ID}
spring.ai.google.genai.embedding.location=us-central1
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.task-type=RETRIEVAL_DOCUMENT

spring.ai.google.genai.project-id=${GENAI_PROJECT_ID}
spring.ai.google.genai.location=us-central1

logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1