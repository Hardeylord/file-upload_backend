
services:
  backend:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - database
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/uploads
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234

  database:
    image: pgvector/pgvector:pg17
    ports:
      - "5433:5432"
    environment:
       POSTGRES_DB : uploads
       POSTGRES_PASSWORD : 1234
       POSTGRES_USER : postgres
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: chunks_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data


volumes:
  db_data:
  redis_data: